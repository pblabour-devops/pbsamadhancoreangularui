<form [formGroup]="Input_Form">
    <input type="hidden" formControlName="id">
    <input type="hidden" formControlName="appRefId">
    <input type="hidden" formControlName="applicationPurposeType">
    <input type="hidden" formControlName="projectSiteVersion">
    <input type="hidden" formControlName="toDoActivityModeType">
    <input type="hidden" formControlName="rootActivityRefId">
    <input type="hidden" formControlName="toDoActivityCategoryType">


    <div class="section-card">
        <h5 class="section-title">Details of offence for which complaint is being filed :</h5>

         <table class="table table-bordered details-table">
            <thead>
                <tr>
                    <th>Section Rule</th>
                    <th>Offence</th>
                    <th style="width: 80px;">Action</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
                        <input type="text" class="form-control" formControlName="sectionRule">
                    </td>
                    <td>
                        <input type="text" class="form-control" formControlName="offence">
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-link text-success p-0" (click)="addOffence()">
                            add 
                        </button>
                </tr>
            </tbody>
        </table>

        

        <table class="table table-bordered details-table" formArrayName="offenceList">
            <thead>
                <tr>
                    <th>Section Rule</th>
                    <th>Offence</th>
                    <th style="width: 80px;">Action</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let offence of offenceList; let i = index">
                    <td>
                        {{ offence.sectionRule }}
                    </td>
                    <td>
                        {{ offence.offence }}
                    </td>
                    <td class="text-center">
                       <button type="button" class="btn btn-link text-danger p-0" (click)="deleteOffence(i)">
                          delete 
                      </button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</form>
