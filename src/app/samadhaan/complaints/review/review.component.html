<div class="pcoded-main-container">
<div class="pcoded-content">
<div class="card" >
<div class="m-2">
<form [formGroup]="Input_Form" (ngSubmit)="onSubmit()">

   <!-- Title bar -->
  <div class="title-bar">
    Application for Your Complaint
  </div>


    <!-- General Information label -->
    <div class="general-info-label">
      General Information <span class="required"></span>
    </div>
      <app-formtab [appSteps]="appFormStepsList"></app-formtab>


  <!-- Basic / General Info -->
  <div class="card-body" style="margin-top: 0px;">



 <div class="section-card">
    <div class="row">
    <div class="col-md-6 mb-4 ">
      <label class="form-label fw-semibold">
      Order No against which review is being filed<span class="text-danger">*</span>
      </label>
        <select
        formControlName="gender"
        class="form-control"
       >
        <option value="" disabled selected>Select</option>
        <option *ngFor="let g of orderOptions" [value]="g">{{ g }}</option>
      </select>
         <div
            class="text-danger"
            *ngIf="Input_Form.get('orderNumber')?.invalid && Input_Form.get('orderNumber')?.touched">
            Required
        </div>
    </div>

    <div class="col-md-6 mb-4 ">
      <label class="form-label fw-semibold">
        Date of the Order <span class="text-danger">*</span>
      </label>
    <input
        type="date"
        formControlName="orderDate"
        class="form-control"
       />
      <div
        class="text-danger"
        *ngIf="Input_Form.get('orderDate')?.invalid && Input_Form.get('orderDate')?.touched">
        Required
        </div>
    </div>
    </div>

    <div class="row">
    <div class="col-md-6 mb-4">
      <label class="form-label fw-semibold">
        Remarks<span class="text-danger">*</span>
      </label>
      <input
        type="text"
        formControlName="remarks"
        class="form-control"
       />
       <div
        class="text-danger"
        *ngIf="Input_Form.get('remarks')?.invalid && Input_Form.get('remarks')?.touched">
        Required
        </div>
    </div>

    </div>
  </div>

  <!-- Action Buttons -->
  <div class="d-flex justify-content-end mt-4 pt-3 border-top">
    <!-- <button type="button" class="btn btn-info text-white mr-3" (click)="onReset()">
      Reset
    </button>
    <button type="button" class="btn mr-3" style="background-color:#1c7fa4;color:#fff;" (click)="onSaveDraft()">
      Save as Draft
    </button> -->
    <button type="submit" class="btn btn-primary">
      Next
    </button>
  </div>
    </div>


</form>
</div>
</div>
  </div>
</div>
