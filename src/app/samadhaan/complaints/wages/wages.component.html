<div class="pcoded-main-container">
    <div class="pcoded-content">
        <div class="card" >
            <div class="m-2">

    <div class="title-bar">
        Application for Your Complaint
      </div>


        <!-- General Information label -->
        <div class="general-info-label">
          General Information <span class="required">*</span>
        </div>
          <app-formtab [appSteps]="appFormStepsList"></app-formtab>

          <app-claim-under-code-on-wages [claimUnderCodeOnWagesApiData]="claimUnderCodeOnWagesApiData" (claimUnderCodeOnWagesDataEvent)="claimUnderCodeOnWagesDataEventListener($event)"></app-claim-under-code-on-wages>
          <app-minimum-wages-not-paid [wagesApiData]="minimumWagesApiData" [wagesPeriodAmtApiData]="minimumWagesPeriodApiData" (minimumWagesDataEvent)="minimumWagesDataDataEventListener($event)" ></app-minimum-wages-not-paid>
          <app-wages-weeklyday [wagesApiData]="wagesWeeklyApiData" [wagesPeriodAmtApiData]="wagesWeeklyPeriodAmtApiData" (wagesWeeklyDayDataEvent)="wagesWeeklyDayEventListener($event)"></app-wages-weeklyday>
          <app-wages-working-overtime [wagesApiData]="wagesOverTimeApiData" [wagesPeriodAmtApiData]="wagesOverTimePeriodAmtApiData" (wagesDataEvent)="wagesWorkingOvertimeEventListener($event)"></app-wages-working-overtime>
          <app-wages-not-paid-at-all [wagesApiData]="wagesNotPaidAtAllApiData" [wagesPeriodAmtApiData]="wagesNotPaidAtAllPeriodAmtApiData" (wagesDataEvent)="wagesNotPaidAtAllEventListener($event)"></app-wages-not-paid-at-all>
          <app-wages-unauthorised-deduction [wagesApiData]="wageUnauthDedApiData" [wagesPeriodAmtApiData]="wageUnauthDedPeriodAmtApiData" (wagesDataEvent)="wagesUnauthDedEventListener($event)"></app-wages-unauthorised-deduction>
          <app-non-payment-bonus [wagesApiData]="nonPayBonusApiData" [wagesPeriodAmtApiData]="nonPayBonusPeriodAmtApiData" (wagesDataEvent)="nonPayBonusEventListener($event)"></app-non-payment-bonus>
    <!-- Action Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="button" class="btn btn-primary" (click)="onSaveDraft()">Save as Draft</button>
      <button type="button" class="btn btn-secondary" (click)="onBack()">Back</button>
      <button type="button" class="btn btn-primary" (click)="onSubmit()">Next</button>
    </div>

    </div>
</div>
    </div>
</div>
