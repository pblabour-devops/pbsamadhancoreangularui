<form [formGroup]="Input_Form">
    <input type="hidden" formControlName="id">
    <input type="hidden" formControlName="appRefId">
    <input type="hidden" formControlName="projectSiteRefId">
    <input type="hidden" formControlName="applicationPurposeType">
    <input type="hidden" formControlName="iPin">
    <input type="hidden" formControlName="investPunjab_AppId">
    <input type="hidden" formControlName="projectSiteVersion">
    <input type="hidden" formControlName="toDoActivityModeType">
    <input type="hidden" formControlName="rootActivityRefId">
    <input type="hidden" formControlName="toDoActivityCategoryType">

      <div class="section-card">

        <h5>A. Claim period for which minimum wages not paid: *</h5>

      <!-- Discharge/Dismissal Question -->
    <div formArrayName="Complaint_MinimumWagesNotPaidDetails">

    <div
        class="row mb-4"
        *ngFor="let group of complaintDetails.controls; let i = index"
        [formGroupName]="i">

        <div class="col">
        <label class="required">From</label>
        <input type="date" class="form-control" formControlName="fromDate">

        <div
            class="text-danger"
            *ngIf="group.get('fromDate')?.invalid && group.get('fromDate')?.touched">
            Required
        </div>
        </div>

        <div class=" col">
        <label class="required">To</label>
        <input type="date" class="form-control" formControlName="toDate">

        <div
            class="text-danger"
            *ngIf="group.get('toDate')?.invalid && group.get('toDate')?.touched">
            Required
        </div>
        </div>

        <div class=" col">
        <label class="required">Amount</label>
        <input type="number" class="form-control" formControlName="amount">

        <div
            class="text-danger"
            *ngIf="group.get('amount')?.invalid && group.get('amount')?.touched">
            Required
        </div>
        </div>

        <div class=" col d-flex align-items-end">

        <button
            *ngIf="i === 0"
            type="button"
            class="btn btn-primary me-2"
            (click)="addMore()">
            Add More
        </button>

        <button
            *ngIf="i > 0"
            type="button"
            class="btn btn-danger"
            (click)="removeRow(i)">
            Delete
        </button>

        </div>

    </div>

    </div>

        <div class=" col">
        <label class="required">Total relief sought</label>
        <input  type="text" class="form-control" formControlName="totalReliefSought"/>
        <div *ngIf="Input_Form.get('totalReliefSought').errors?.required && Input_Form.get('totalReliefSought').touched" class="text-danger">
            Required
        </div>
        </div>

          <div class=" col">
        <label class="required">Compensation Sought</label>
        <input  type="text" class="form-control" formControlName="compensationSought"/>
        <div *ngIf="Input_Form.get('compensationSought').errors?.required && Input_Form.get('compensationSought').touched" class="text-danger">
            Required
        </div>
        </div>

           <div class=" col">
        <label>Details about the claim (s) (if any)</label>
        <input  type="text" class="form-control" formControlName="detailAboutTheClaim"/>
        <div *ngIf="Input_Form.get('detailAboutTheClaim').errors?.required && Input_Form.get('detailAboutTheClaim').touched" class="text-danger">
            Required
        </div>
        </div>
