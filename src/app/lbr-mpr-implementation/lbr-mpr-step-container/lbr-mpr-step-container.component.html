<div class="container" style="margin-top: 80px;">
  <div class="card shadow-sm rounded p-4 mx-auto" style="max-width: 1200px;">
    <div class="row align-items-center mb-3">
   
      <div class="col-4">
        <div class="leftarrow">
          <a class="custom-link"
             style="margin-top: 6px; cursor: pointer !important;"
             (click)="prevStep()"
             [class.disabled]="currentIndex === 0">
            &lt; {{ stepList[currentIndex - 1]?.partHeading }}
          </a>
        </div>
      </div>
  

      <div class="col-4">
          <div class="center" style="text-align: center;">
        <button class="btn btn-outline-primary btn-sm" (click)="openStepperModal(stepperContent)">
          {{ stepList[currentIndex]?.partHeading }} - {{ stepList[currentIndex]?.partSubHeading }}
        </button>
      </div>
      </div>

 
      <div class="col-4">
        <div class="rightarrow" style="float: right;">
          <a class="custom-link"
             style="margin-top: 6px; cursor: pointer !important;"
             (click)="nextStep()"
             [class.disabled]="currentIndex === stepList.length - 1">
            {{ stepList[currentIndex + 1]?.partHeading }} &gt;
          </a>
        </div>
      </div>
    </div>

    <hr class="my-3" />

    <app-lbr-mpr-main  #mprMainForm [formJson]="currentFormData" [isLockStep]="isLockStep || isViewOnly"></app-lbr-mpr-main>

  <div class="text-center mt-4">

  <ng-container *ngIf="!isViewOnly">
    <button
      *ngIf="stepList[currentIndex].stepCode !== 'LOCK'"
      class="btn btn-success btn-sm"
      style="margin-right:10px;"
      (click)="saveAndNext()"
      [disabled]="isLockStep"
    >
      Save & Next
    </button>

    <button
      *ngIf="stepList[currentIndex].stepCode === 'LOCK'"
      class="btn btn-danger btn-sm"
      style="margin-right:10px;"
      (click)="confirmAndLock()"
      [disabled]="isLockStep"
    >
      Confirm & Lock
    </button>
  </ng-container>


  <button
    class="btn btn-primary btn-sm"
    (click)="NavigateToDashboard()"
    [disabled]="isLockStep"
  >
    Back to Dashboard
  </button>
</div>



  </div>
</div>  


<ng-template #stepperContent let-modal>
  <div class="modal-header">
    <h5 class="modal-title fw-bold">MPR Modal</h5>
    <button type="button"  class="close" aria-label="Close" (click)="modal.dismiss('Cross click')"> <span aria-hidden="true">&times;</span></button>
  </div>

  <div class="modal-body p-3">
    <table class="table table-bordered align-middle text-center">
      <thead class="table-light">
        <tr>
          <th class="fw-semibold">MPR Report Part</th>
          <th class="fw-semibold">Is Completed</th>
          <th class="fw-semibold">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let step of stepList; let i = index">
          <td class="py-2 text-start">{{ step.partHeading }} - {{ step.partSubHeading }}</td>
          <td>
            <span [ngClass]="{
              'text-success fw-semibold': step.isCompleted,
              'text-danger fw-semibold': !step.isCompleted
            }">
              {{ step.isCompleted ? 'Filled' : 'Pending' }}
            </span>
          </td>
          <td>
            <a class="text-primary text-decoration-underline"
               style="cursor: pointer;"
               (click)="navigateToStep(i); modal.close()">Go to this step</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-danger btn-sm" (click)="modal.dismiss()">Close</button>
  </div>
</ng-template>
