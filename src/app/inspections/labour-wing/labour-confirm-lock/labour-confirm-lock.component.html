<div class="main-content">
    <div class="card col-md-10 card-form">
        <form [formGroup]="Input_Form" (ngSubmit)="onSubmit()">
            <div class="col-md-12">
            </div>
            <div class="col-md-12">
                <div class="register-modal-header">
                <h4 class="text-center form-header">Confirm & Lock</h4>
                </div>
            </div>
            <div class="container mt-4">
                <div *ngIf="canLock" class="col-md-12"><button class="btn btn-success" type="submit">Lock Inspection</button></div>
                <div *ngIf="!canLock" class="col-md-12 text-danger">Before lock inspection, please fill all pending steps</div>
            </div>
        </form>
    </div>
  </div>
