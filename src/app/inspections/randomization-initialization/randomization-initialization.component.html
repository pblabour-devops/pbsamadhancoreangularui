<div class="pcoded-main-container">
  <div class="pcoded-content">
    <div class="card bg-light shadow-lg p-4 rounded-lg m-t-20" style="border: none; max-width: 1000px; margin: 0 auto;">
      
      <!-- Title Section -->
        <div class="row mb-4 justify-content-center text-center">
          <div class="col">
            <h4 class="text-success fw-bold d-flex justify-content-center align-items-center">
              <span class="process-circle me-3 fs-3">⚙️</span>
              Randomization Initialization
            </h4>
            <p class="text-muted fs-4">Randomization of inspections according to their circles.</p>
          </div>
        </div>

        <div class="row mb-4 justify-content-center">
          <div class="col-md-2 text-center">
            <label for="deemedDate" class="form-label text-dark fw-semibold">
              Year: <span class="text-success fs-5 fw-bold">{{currentYear}}</span>
            </label>
          </div>
          <div class="col-md-2 text-center">
            <label for="deemedDate" class="form-label text-dark fw-semibold">
              Month: <span class="text-success fs-5 fw-bold">{{getMonthName(currentMonth)}}</span>
            </label>
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-md-4 text-center">
            <button type="submit" (click)="getReport()" class="btn btn-primary w-100 py-2 rounded-pill shadow-sm transition-all hover:scale-105">
              <span class="fw-bold">Start Randomization</span>
            </button>
          </div>
        </div>

        <div *ngIf="randomizationResult?.randomizationStatus === 0" class="alert alert-warning mt-3 d-flex align-items-center justify-content-between">
          <span class="fw-bold">Please Wait....! Your randomization of {{getMonthName(currentMonth)}}  {{currentYear}} is in process.</span>
          <i class="fas fa-solid fa-gears text-danger"></i>
        </div>

      <div *ngIf="randomizationResult?.randomizationStatus === 1" class="alert alert-success mt-3 d-flex align-items-center justify-content-between">
        <span class="fw-bold"> Your randomization of {{getMonthName(currentMonth)}}  {{currentYear}} is already processed.</span>
        <i class="fas fa-check-circle text-success"></i>
      </div>

    </div>
  </div>
</div>
