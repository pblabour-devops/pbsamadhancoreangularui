<div class="pcoded-main-container">
  <div class="pcoded-content">
<div class="row">
  <div class="col-sm-12">
    <div class="dashboard-container">

      <div class="instructions-card">


        <hr class="title-divider" />

        <!-- Section Title -->
        <h2 class="instructions-title text-center">FAQs</h2>

        <!-- Accordion Panels -->
        <div class="accordion">
          <div class="accordion-item" *ngFor="let faq of faqs; let i = index">
            <div class="accordion-header" (click)="toggleFAQ(i)">
              <span>{{ faq.question }}</span>
              <span class="chevron" [class.rotated]="faq.isOpen">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6 9L12 15L18 9" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>

            <div class="accordion-content" *ngIf="faq.isOpen">

              <!-- Simple text answer -->
              <p *ngIf="faq.answer" class="mb-0 small" style="white-space: pre-line;">
                {{ faq.answer }}
              </p>

              <!-- Table-based answer (FAQ #2) -->
              <div *ngIf="faq.tableRows" class="table-responsive">
                <table class="table table-bordered mb-0 small">
                  <thead>
                    <tr class="bg-body-secondary">
                      <th style="width: 40%;">Issues</th>
                      <th style="width: 40%;">Who can raise the complaint?</th>
                      <th style="width: 20%;">Applicable Act</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let row of faq.tableRows">
                      <td style="white-space: pre-line;">{{ row.issues }}</td>
                      <td style="white-space: pre-line;">{{ row.whoCanRaise }}</td>
                      <td>{{ row.applicableAct }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>

            </div>
          </div>
        </div>

      </div>

      <!-- Bottom gray area -->
      <div class="bottom-area"></div>
    </div>
  </div>
</div>
</div>
</div>
