<div class="pcoded-main-container">
  <div class="pcoded-content">
    <div class="row">
      <div class="col-sm-12">
        <div class="container-fluid p-0">

          <!-- Top gray strip -->
          <div class="bg-body-secondary" style="height: 8px;"></div>

          <div class="bg-white p-4 border border-top-0">

            <!-- File application for -->
            <div class="d-flex flex-wrap align-items-center gap-4 mb-3">

              <span class="bg-body-secondary py-2 fw-bold">
                File application for:
              </span>

              <div class="toggle-group flex-wrap" role="radiogroup" aria-labelledby="filingTypeLabel" style="padding-left: 20px;">
                <label class="toggle-option" *ngFor="let type of filingTypes">
                  <input
                    type="radio"
                    name="filingType"
                    (change)="toggleComplaint(type)"
                    [id]="type.value"
                    [value]="+type.value"
                    [(ngModel)]="selectedFilingType">
                  <span>{{ type.text }}</span>
                </label>
              </div>

            </div> <!-- ✅ ADDED: properly close d-flex wrapper here -->

            <!-- Instructions -->
            <p class="fw-semibold mb-1">
              Please select issues from the list below (You can tick more than one option):
            </p>
            <hr class="mb-4">

            <div class="row g-4">
        <div class="col-md-6 mb-3" *ngFor="let category of categories">
          <div class="border h-100">

            <div class="category-header text-white fw-semibold px-3 py-2">
              {{ category.title }}
            </div>

            <div class="p-3">
              <div class="form-check mb-2" *ngFor="let issue of category.issues">
                <input
                  class="form-check-input"
                  type="checkbox"
                  (change)="toggleIssue(issue)"
                  [id]="issue.id"
                  [disabled]="issue.disabled">
                <label class="form-check-label small" [for]="issue.id" [class.text-muted]="issue.disabled">
                  {{ issue.label }}
                  <span class="tooltip-wrapper" *ngIf="issue.hasInfo">
                    <span class="info-icon">i</span>
                    <span class="tooltip-content">{{ issue.info || issue.label }}</span>
                  </span>
                </label>
              </div>
            </div>

          </div>
        </div>
      </div>

            <!-- @if(selectedFilingType == 'Self'){
              <app-self (selectedIssueEventEmitter)="setSelectedIssues($event)"></app-self>
            }
            @if(selectedFilingType == 'Nominee'){
              <app-nominee></app-nominee>
            }
            @if(selectedFilingType == 'Legal Heir'){
              <app-legal-heir></app-legal-heir>
            }
            @if(selectedFilingType == 'Legal Representative'){
              <app-legal-representative></app-legal-representative>
            }
            @if(selectedFilingType == 'Authorized Representative'){
              <app-authorized-representative></app-authorized-representative>
            }
            @if(selectedFilingType == 'Group of Workers'){
              <app-group-of-workers></app-group-of-workers>
            } -->

            <hr class="my-4">

            <div class="d-flex justify-content-end">
              <!-- Next Button -->
              <button
                type="button"
                class="btn btn-primary px-4"
                (click)="selectedissue()">
                Next
              </button>
            </div>

          </div> <!-- closes bg-white -->
        </div> <!-- closes container-fluid -->
      </div> <!-- closes col-sm-12 -->
    </div> <!-- closes row -->
  </div> <!-- closes pcoded-content -->
</div> <!-- closes pcoded-main-container -->
