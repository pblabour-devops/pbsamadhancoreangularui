<section class="pcoded-main-container">
    <div class="pcoded-content">
<div class="container-fluid p-4">

  <!-- Summary Cards -->
  <div class="row g-4">
    <div class="col-md-6" *ngFor="let summary of applicationSummaries">
      <div class="card border-0 shadow-sm h-100 rounded-3">
        <div class="card-body p-4 d-flex flex-column justify-content-between">

          <!-- Top row: Icon left + Title & Total right -->
          <div class="d-flex justify-content-between align-items-center">

            <div class="icon-circle d-flex align-items-center justify-content-center rounded-circle" [ngClass]="summary.iconBg">
              <i class="feather fs-4" [ngClass]="summary.icon"></i>
            </div>

            <div class="text-end">
              <a href="javascript:void(0)" class="text-primary text-decoration-none fw-semibold d-block mb-1">
                {{ summary.title }}
              </a>
              <div class="fw-bold fs-4">
                {{ summary.total }}
              </div>
            </div>

          </div>

          <!-- Bottom row: More Info -->
          <div class="d-flex justify-content-end align-items-center border-top pt-3 mt-3">
            <a routerLink="/dashboard/draft-application" class="text-primary text-decoration-none small">
              More Info <i class="feather icon-arrow-right"></i>
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
    </div>
</section>
