<div class="pcoded-main-container">
  <div class="pcoded-content">
    <div class="row">
      <div class="col-sm-12">
        <div class="container-fluid p-4">

          <!-- Breadcrumb -->
          <nav class="mb-3">
            <a href="javascript:void(0)" class="text-primary text-decoration-none fw-medium">Dashboard</a>
          </nav>

          <!-- Summary Cards -->
          <div class="row g-4">
            <div class="col-md-6" *ngFor="let summary of applicationSummaries">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-4">

                  <!-- Top row: Icon + Title + Total -->
                  <div class="d-flex justify-content-between align-items-start mb-3">
                    <div class="icon-circle" [ngClass]="summary.iconBg">
                      <i class="feather" [ngClass]="summary.icon"></i>
                    </div>

                    <div class="text-end">
                      <a href="javascript:void(0)" class="text-primary text-decoration-none fw-medium d-block mb-1">
                        {{ summary.title }}
                      </a>
                      <div class="fw-bold fs-6">
                        Total : {{ summary.total }}
                      </div>
                        <a routerLink="/dashboard/draft-application" class="text-primary text-decoration-none small">
                      More Info <i class="feather icon-arrow-right"></i>
                    </a>
                    </div>
                  </div>

                  <hr class="my-3">

                  <!-- Bottom row: Pending + Disposed -->
                  <!-- <div class="d-flex justify-content-between align-items-center">
                    <a href="javascript:void(0)" class="text-primary text-decoration-none small">
                      Pending : {{ summary.pending }} <i class="feather icon-arrow-right"></i>
                    </a>
                    <a href="javascript:void(0)" class="text-primary text-decoration-none small">
                      Disposed : {{ summary.disposed }} <i class="feather icon-arrow-right"></i>
                    </a>
                  </div> -->

                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
